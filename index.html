<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Zero Token</title>
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #252525;
    --border: #333;
    --text: #e5e5e5;
    --text2: #999;
    --text3: #666;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --user-bg: #1d3b6b;
    --green: #22c55e;
    --red: #ef4444;
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex;
  }

  /* ── Sidebar ────────────────────────────── */
  .sidebar {
    width: 260px; background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  .sidebar-header {
    padding: 20px; border-bottom: 1px solid var(--border);
  }
  .sidebar-header h1 { font-size: 16px; font-weight: 600; color: var(--text); }
  .sidebar-header p { font-size: 12px; color: var(--text3); margin-top: 4px; }
  .sidebar-models {
    flex: 1; overflow-y: auto; padding: 12px;
  }
  .sidebar-models h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--text3); padding: 8px 4px; margin-top: 8px;
  }
  .model-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-radius: var(--radius-sm); cursor: pointer; transition: background .15s;
    font-size: 13px; color: var(--text2); margin-bottom: 2px;
  }
  .model-item:hover { background: var(--surface2); }
  .model-item.active { background: var(--accent); color: #fff; }
  .model-item .dot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  }
  .model-item .dot.ok { background: var(--green); }
  .model-item .dot.no { background: var(--red); }
  .model-item .name { flex: 1; }
  .model-item .badge { font-size: 10px; opacity: 0.6; }
  .sidebar-footer {
    padding: 12px; border-top: 1px solid var(--border);
    font-size: 11px; color: var(--text3);
  }
  .sidebar-footer a { color: var(--accent); text-decoration: none; }

  /* ── Main ──────────────────────────────── */
  .main {
    flex: 1; display: flex; flex-direction: column; min-width: 0;
  }

  /* ── Header ─────────────────────────────── */
  .header {
    padding: 14px 24px; background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .header .current-model { font-size: 14px; font-weight: 600; }
  .header .model-info { font-size: 12px; color: var(--text2); }
  .header .actions { display: flex; gap: 8px; }
  .header .btn-icon {
    background: none; border: 1px solid var(--border); color: var(--text2);
    width: 34px; height: 34px; border-radius: var(--radius-sm); cursor: pointer;
    font-size: 14px; display: flex; align-items: center; justify-content: center;
  }
  .header .btn-icon:hover { background: var(--surface2); color: var(--text); }

  /* ── Messages ───────────────────────────── */
  .messages {
    flex: 1; overflow-y: auto; padding: 32px 24px;
    display: flex; flex-direction: column; gap: 20px;
    scroll-behavior: smooth;
  }
  .messages:empty::after {
    content: ''; display: none;
  }

  /* Welcome */
  .welcome {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 24px; padding: 48px 24px; color: var(--text2);
  }
  .welcome h2 { font-size: 24px; color: var(--text); font-weight: 500; }
  .welcome p { font-size: 14px; max-width: 480px; text-align: center; line-height: 1.6; }
  .welcome .model-cards { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .welcome .model-card {
    background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 20px; cursor: pointer; transition: all .15s; min-width: 140px; text-align: center;
  }
  .welcome .model-card:hover { border-color: var(--accent); }
  .welcome .model-card .mc-name { font-size: 14px; color: var(--text); margin-bottom: 4px; }
  .welcome .model-card .mc-status { font-size: 11px; }
  .welcome .model-card .mc-status.ok { color: var(--green); }

  /* Message bubbles */
  .msg-row { display: flex; gap: 12px; max-width: 85%; }
  .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row.assistant { align-self: flex-start; }
  .msg-avatar {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .msg-row.user .msg-avatar { background: var(--accent); }
  .msg-row.assistant .msg-avatar { background: var(--surface2); border: 1px solid var(--border); }
  .msg-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .msg-text {
    padding: 12px 16px; border-radius: var(--radius); line-height: 1.65;
    white-space: pre-wrap; word-break: break-word; font-size: 14px;
  }
  .msg-row.user .msg-text { background: var(--user-bg); }
  .msg-row.assistant .msg-text { background: var(--surface2); border: 1px solid var(--border); }
  .msg-row.assistant .msg-text:has(+ .thinking-box) {
    border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom: none;
  }
  .msg-time { font-size: 11px; color: var(--text3); padding: 0 4px; }
  .msg-actions { display: flex; gap: 4px; padding: 0 4px; opacity: 0; transition: opacity .15s; }
  .msg-row:hover .msg-actions { opacity: 1; }
  .msg-actions button {
    background: none; border: none; color: var(--text3); font-size: 11px;
    cursor: pointer; padding: 2px 4px; border-radius: 4px;
  }
  .msg-actions button:hover { color: var(--text); background: var(--surface2); }

  /* Tool call */
  .tool-call {
    margin: 4px 0; border: 1px solid #92400e; border-radius: var(--radius-sm);
    background: #1a1206; overflow: hidden;
  }
  .tool-call summary {
    padding: 8px 14px; color: #f59e0b; font-size: 12px; cursor: pointer;
    font-family: monospace; display: flex; align-items: center; gap: 6px;
  }
  .tool-call .tool-args {
    padding: 8px 14px; color: var(--text2); font-size: 12px;
    font-family: monospace; white-space: pre-wrap; max-height: 120px; overflow-y: auto;
  }
  .tool-result {
    margin: 4px 0; padding: 8px 14px; border: 1px solid #065f46; border-radius: var(--radius-sm);
    background: #041a10; color: #34d399; font-size: 12px; font-family: monospace;
  }

  /* Thinking box */
  .thinking-box {
    border: 1px solid var(--border); border-top: none;
    background: var(--surface); border-radius: 0 0 var(--radius) var(--radius);
    overflow: hidden;
  }
  .thinking-box summary {
    padding: 8px 16px; color: var(--text3); font-size: 12px;
    cursor: pointer; user-select: none; display: flex; align-items: center; gap: 6px;
  }
  .thinking-box summary:hover { color: var(--text2); }
  .thinking-box summary::before { content: '🧠'; font-size: 12px; }
  .thinking-box .thinking-text {
    padding: 0 16px 12px; color: var(--text3); font-size: 13px;
    line-height: 1.6; white-space: pre-wrap; max-height: 280px; overflow-y: auto;
  }

  /* Loading */
  .loading { display: flex; gap: 4px; padding: 12px 16px; }
  .loading span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--text3);
    animation: bounce 1.4s infinite ease-in-out both;
  }
  .loading span:nth-child(1) { animation-delay: -0.32s; }
  .loading span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }

  /* ── Input ──────────────────────────────── */
  .input-area {
    padding: 16px 24px; background: var(--surface); border-top: 1px solid var(--border);
  }
  .input-row { display: flex; gap: 10px; align-items: flex-end; }
  .input-row textarea {
    flex: 1; background: var(--surface2); color: var(--text); border: 1px solid var(--border);
    padding: 12px 16px; border-radius: var(--radius); font-size: 14px;
    font-family: inherit; resize: none; min-height: 46px; max-height: 200px;
    line-height: 1.5; outline: none;
    transition: border-color .15s;
  }
  .input-row textarea:focus { border-color: var(--accent); }
  .input-row textarea::placeholder { color: var(--text3); }
  .send-btn {
    background: var(--accent); color: #fff; border: none;
    padding: 12px 20px; border-radius: var(--radius); font-size: 14px;
    cursor: pointer; font-weight: 500; white-space: nowrap;
    transition: background .15s; height: 46px;
  }
  .send-btn:hover { background: var(--accent-hover); }
  .send-btn:disabled { background: var(--border); color: var(--text3); cursor: not-allowed; }
  .input-hint { font-size: 11px; color: var(--text3); margin-top: 8px; text-align: center; }

  /* ── Mode Tabs ───────────────────────────── */
  .mode-tabs {
    display: flex; gap: 4px; padding: 4px; background: var(--surface2);
    border-radius: var(--radius); margin-right: 12px;
  }
  .mode-tab {
    padding: 6px 14px; border: none; background: transparent; color: var(--text3);
    border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; font-family: inherit;
    transition: all .15s; white-space: nowrap;
  }
  .mode-tab:hover { color: var(--text); }
  .mode-tab.active { background: var(--accent); color: #fff; }

  /* ── Chat Room 3-Column Layout ──────────── */
  .chatroom-layout {
    display: none; flex: 1; min-height: 0; overflow: hidden;
  }
  .croom-left {
    width: 280px; flex-shrink: 0; background: var(--surface);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    overflow-y: auto;
  }
  .croom-left h3 { font-size: 13px; color: var(--text2); padding: 16px 16px 8px; }
  .croom-left .participant-list { padding: 0 12px 12px; }
  .croom-left .participant-card { margin-bottom: 8px; }
  .croom-left .croom-left-footer { padding: 12px; border-top: 1px solid var(--border); }

  .croom-center {
    flex: 1; display: flex; flex-direction: column; min-width: 0;
    background: var(--bg);
  }
  .croom-center .messages { flex: 1; overflow-y: auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 12px; }
  .croom-center .croom-topic-bar {
    padding: 12px 16px; background: var(--surface); border-top: 1px solid var(--border);
    display: flex; gap: 8px;
  }
  .croom-center .croom-topic-bar textarea {
    flex: 1; background: var(--surface2); color: var(--text); border: 1px solid var(--border);
    padding: 8px 12px; border-radius: var(--radius-sm); font-size: 13px;
    font-family: inherit; resize: none; min-height: 38px; outline: none;
  }
  .croom-center .croom-topic-bar textarea:focus { border-color: var(--accent); }

  .croom-right {
    width: 240px; flex-shrink: 0; background: var(--surface);
    border-left: 1px solid var(--border); display: flex; flex-direction: column;
    padding: 16px; gap: 12px; overflow-y: auto;
  }
  .croom-right h3 { font-size: 13px; color: var(--text2); }
  .croom-right label { font-size: 11px; color: var(--text3); display: block; margin-bottom: 4px; }
  .croom-right input, .croom-right textarea {
    background: var(--surface2); color: var(--text); border: 1px solid var(--border);
    padding: 8px 12px; border-radius: var(--radius-sm); font-size: 13px;
    font-family: inherit; outline: none; width: 100%;
  }
  .croom-right input:focus, .croom-right textarea:focus { border-color: var(--accent); }
  .croom-right .croom-status {
    font-size: 12px; color: var(--text3); text-align: center; padding: 8px;
    background: var(--surface2); border-radius: var(--radius-sm);
  }
  .participant-card {
    background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px;
  }
  .participant-card .pc-avatar {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 600;
  }
  .participant-card .pc-info { flex: 1; min-width: 0; }
  .participant-card .pc-name { font-size: 14px; font-weight: 600; color: var(--text); }
  .participant-card .pc-persona { font-size: 12px; color: var(--text2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .participant-card .pc-model { font-size: 11px; color: var(--text3); }
  .participant-card .pc-remove {
    background: none; border: none; color: var(--text3); cursor: pointer; font-size: 16px;
    padding: 4px 8px; border-radius: 4px;
  }
  .participant-card .pc-remove:hover { color: var(--red); }

  .btn-primary {
    background: var(--accent); color: #fff; border: none;
    padding: 10px 20px; border-radius: var(--radius); font-size: 14px;
    cursor: pointer; font-family: inherit; font-weight: 500;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary {
    background: var(--surface2); color: var(--text2); border: 1px solid var(--border);
    padding: 8px 16px; border-radius: var(--radius-sm); font-size: 13px;
    cursor: pointer; font-family: inherit;
  }
  .btn-secondary:hover { background: var(--border); color: var(--text); }

  /* ── Chat Room Messages ─────────────────── */
  .croom-msg {
    display: flex; gap: 12px; max-width: 85%; align-self: flex-start;
    margin-bottom: 4px;
  }
  .croom-msg .croom-avatar {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
  }
  .croom-msg .croom-bubble {
    background: var(--surface2); border: 1px solid var(--border);
    padding: 10px 14px; border-radius: var(--radius); line-height: 1.6;
    font-size: 14px; white-space: pre-wrap; word-break: break-word;
  }
  .croom-msg .croom-speaker { font-size: 11px; color: var(--accent); margin-bottom: 4px; font-weight: 600; }
  .croom-msg .croom-time { font-size: 11px; color: var(--text3); margin-top: 4px; }
  .croom-msg.host { align-self: flex-end; }
  .croom-msg.host .croom-bubble { background: var(--user-bg); border-color: var(--user-bg); }

  .croom-controls {
    display: flex; gap: 8px; align-items: center; justify-content: center;
    padding: 8px 0; margin-top: 8px;
  }
  .croom-status {
    font-size: 12px; color: var(--text3); text-align: center; padding: 4px;
  }

  /* ── Log Panel ──────────────────────────── */
  .log-panel {
    width: 260px; flex-shrink: 0; background: var(--surface);
    border-left: 1px solid var(--border); display: flex; flex-direction: column;
    overflow: hidden;
  }
  .log-panel h3 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--text3); padding: 16px 16px 8px; margin: 0;
  }
  .log-panel .log-list {
    flex: 1; overflow-y: auto; padding: 0 12px 12px;
  }
  .log-entry {
    padding: 8px 10px; margin-bottom: 6px; background: var(--surface2);
    border-radius: var(--radius-sm); font-size: 11px; line-height: 1.5;
    border-left: 2px solid var(--border); cursor: default;
  }
  .log-entry .log-time { color: var(--text3); font-size: 10px; }
  .log-entry .log-model { color: var(--accent); font-weight: 600; }
  .log-entry .log-preview { color: var(--text2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log-entry .log-meta { color: var(--text3); font-size: 10px; margin-top: 1px; }
  .log-entry.error { border-left-color: var(--red); }
  .log-entry.streaming { border-left-color: #f59e0b; }

  .log-panel-footer {
    padding: 8px 12px; border-top: 1px solid var(--border);
    font-size: 10px; color: var(--text3); text-align: center;
  }

  /* ── Mobile ────────────────────────────── */
  @media (max-width: 768px) {
    .sidebar, .log-panel { display: none; }
    .msg-row { max-width: 95%; }
    .header { padding: 12px 16px; }
    .messages { padding: 16px; }
    .input-area { padding: 12px 16px; }
  }
</style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-header">
    <h1>My Zero Token</h1>
    <p>Zero-cost LLM gateway</p>
  </div>
  <div class="sidebar-models" id="sidebar-models">
    <h3>可用模型</h3>
    <div id="model-list">加载中...</div>
  </div>
  <div class="sidebar-footer">
    <a href="#" onclick="window.open('/v1/models')">API →</a>
    &nbsp;·&nbsp; port 3001
  </div>
</aside>

<!-- Main -->
<div class="main">
  <header class="header">
    <div>
      <div class="current-model" id="current-model-name">选择模型</div>
      <div class="model-info" id="current-model-info"></div>
    </div>
    <div class="actions">
      <div class="mode-tabs" id="mode-tabs">
        <button class="mode-tab active" data-mode="chat" onclick="switchMode('chat')">💬 聊天</button>
        <button class="mode-tab" data-mode="tool" onclick="switchMode('tool')">🔧 工具</button>
        <button class="mode-tab" data-mode="chatroom" onclick="switchMode('chatroom')">🎭 聊天室</button>
      </div>
      <button class="btn-icon" title="清空对话" onclick="clearChat()">↺</button>
      <button class="btn-icon" title="切换模型" onclick="document.getElementById('model-list').scrollIntoView()">⇄</button>
    </div>
  </header>

  <!-- Chat Room 3-Column Layout -->
  <div class="chatroom-layout" id="chatroom-layout">
    <!-- Left: Participants -->
    <div class="croom-left">
      <h3>🎭 参与者</h3>
      <div class="participant-list" id="participant-list"></div>
      <div class="croom-left-footer">
        <button class="btn-secondary" onclick="addParticipant()" style="width:100%;">+ 添加参与者</button>
      </div>
    </div>

    <!-- Center: Messages -->
    <div class="croom-center">
      <div class="messages" id="croom-messages"></div>
      <div class="croom-topic-bar">
        <textarea id="croom-topic" rows="1" placeholder="输入开场白 / 话题..."></textarea>
        <button class="btn-primary" id="croom-start" onclick="startChatRoom()">▶ 开始</button>
      </div>
    </div>

    <!-- Right: Controls -->
    <div class="croom-right">
      <h3>⚙️ 控制</h3>
      <div>
        <label>最大轮数</label>
        <input type="number" id="croom-rounds" value="10" min="1" max="50">
      </div>
      <div>
        <label>轮间延迟 (秒)</label>
        <input type="number" id="croom-delay" value="1.5" min="0.5" max="10" step="0.5">
      </div>
      <button class="btn-primary" id="croom-stop" onclick="stopChatRoom()" style="display:none;width:100%;background:var(--red);">⏹ 停止</button>
      <div class="croom-status" id="croom-status"></div>
      <hr style="border-color:var(--border);margin:4px 0;">
      <button class="btn-secondary" onclick="showManageCroomSessions()" style="width:100%;">📋 会话管理</button>
      <button class="btn-secondary" onclick="exportCroomSession()" style="width:100%;">📥 导出</button>
      <button class="btn-secondary" onclick="importCroomSession()" style="width:100%;">📤 导入</button>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <h2>👋 开始对话</h2>
      <p>选择一个模型，发送消息即可开始。已授权的模型（绿点）自动加载凭证。</p>
      <div class="model-cards" id="welcome-cards"></div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)" autocomplete="off"></textarea>
      <button class="send-btn" id="send" disabled>发送</button>
    </div>
    <div class="input-hint" id="input-hint">请先在侧边栏选择一个模型</div>
  </div>
</div>

<!-- Log Panel (chat/tool modes) -->
<aside class="log-panel" id="log-panel">
  <h3>📋 请求日志</h3>
  <div class="log-list" id="log-list">
    <div style="color:var(--text3);font-size:11px;padding:8px;">选择模型发送消息后，日志将显示在这里</div>
  </div>
  <div class="log-panel-footer" id="log-footer">就绪</div>
</aside>

<script>
const API = window.location.origin;
const $messages = document.getElementById('messages');
const $input = document.getElementById('input');
const $send = document.getElementById('send');
const $welcome = document.getElementById('welcome');
const $modelList = document.getElementById('model-list');
const $welcomeCards = document.getElementById('welcome-cards');
const $currentName = document.getElementById('current-model-name');
const $currentInfo = document.getElementById('current-model-info');
const $inputHint = document.getElementById('input-hint');
const $cookieRow = document.getElementById('cookie-row');
const $logList = document.getElementById('log-list');
const $logFooter = document.getElementById('log-footer');

// ── Request Log ────────────────────────────
const reqLog = [];
function addLogEntry(entry) {
  reqLog.unshift(entry);
  if (reqLog.length > 50) reqLog.pop();
  renderLogPanel();
}
function renderLogPanel() {
  if (!$logList) return;
  if (reqLog.length === 0) {
    $logList.innerHTML = '<div style="color:var(--text3);font-size:11px;padding:8px;">选择模型发送消息后，日志将显示在这里</div>';
    return;
  }
  $logList.innerHTML = reqLog.map(e => `
    <div class="log-entry${e.error ? ' error' : ''}${e.streaming ? ' streaming' : ''}">

// ── Thinking split (client-side) ──────────

function splitThinking(text) {
  const t = (text || '').trim();
  if (!t || t.length < 80) return { content: t, thinking: '' };
  const mi = t.indexOf(' response');
  if (mi > 20) return { thinking: t.slice(0, mi).trim(), content: t.slice(mi + 9).trim() };
  const re = /[.!?。！？\n](?=\s*[A-Z\u4e00-\u9fff])/g;
  const pts = []; let m;
  while ((m = re.exec(t)) !== null) pts.push(m.index + 1);
  if (pts.length < 3) return { content: t, thinking: '' };
  let best = -1, bestS = 0;
  for (const p of pts) {
    const a = t.slice(p).trimStart();
    let s = 0;
    if (/^(你好|您好|Hello\b|Hi\b|Sure\b|当然|Here|以下|好的|没问题)/i.test(a)) s = 50;
    if (s > bestS) { bestS = s; best = p; }
  }
  if (best > 0 && bestS >= 50) return { thinking: t.slice(0, best).trim(), content: t.slice(best).trim() };
  return { content: t, thinking: '' };
}

// ── Send message ───────────────────────────

async function callLLM(messages, onDelta) {
  const t0 = Date.now();
  const lastMsg = messages[messages.length - 1]?.content?.slice(0, 60) || '';
  addLogEntry({ time: timeStr(), model: currentModel.split('/').pop(), preview: lastMsg, ms: 0, tokens: 0, streaming: true });
  const headers = authHeaders({ 'Content-Type': 'application/json' });
  const cookie = getCookie();
  if (cookie) headers['x-cookie'] = cookie;

  const body = { model: currentModel, messages, stream: true };
  if (toolsEnabled) body.tools = TEST_TOOLS;

  const resp = await fetch(API + '/v1/chat/completions', {
    method: 'POST', headers,
    body: JSON.stringify(body),
  });

  if (!resp.ok) {
    const err = await resp.json().catch(() => ({ error: { message: 'HTTP ' + resp.status } }));
    throw new Error(err.error?.message || 'Request failed');
  }

  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = '', fullText = '', fullThinking = '';
  const toolCalls = [];

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split('\n');
    buf = lines.pop() || '';

    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      const d = line.slice(6);
      if (d === '[DONE]') continue;
      try {
        const p = JSON.parse(d);
        const delta = p.choices?.[0]?.delta;
        if (!delta) continue;
        if (delta.reasoning_content) fullThinking += delta.reasoning_content;
        if (delta.content) fullText += delta.content;
        if (delta.tool_calls) {
          for (const tc of delta.tool_calls) {
            const idx = tc.index || 0;
            if (!toolCalls[idx]) toolCalls[idx] = { id: tc.id || '', name: '', arguments: '' };
            if (tc.id) toolCalls[idx].id = tc.id;
            if (tc.function?.name) toolCalls[idx].name = tc.function.name;
            if (tc.function?.arguments) toolCalls[idx].arguments += tc.function.arguments;
          }
        }
        if (onDelta) onDelta({ fullText, fullThinking, toolCalls: toolCalls.filter(Boolean) });
      } catch {}
    }
  }
  const totalTokens = (fullText + fullThinking).length;
  if (reqLog[0]) { reqLog[0].ms = Date.now() - t0; reqLog[0].tokens = totalTokens; reqLog[0].streaming = false; renderLogPanel(); }
  return { content: fullText, thinking: fullThinking, toolCalls: toolCalls.filter(Boolean) };
}

async function sendMessage() {
  if (currentMode === 'chatroom') return; // chat room has its own controls
  const content = $input.value.trim();
  if (!content || !currentModel || isStreaming) return;

  addUserMsg(content);
  $input.value = '';
  $input.style.height = 'auto';
  chatHistory.push({ role: 'user', content });
  isStreaming = true;
  $send.disabled = true;

  const loadingRow = addAssistantBubble('', '', true);

  try {
    let msgs = [...chatHistory];
    let maxRounds = 3;

    while (maxRounds-- > 0) {
      const result = await callLLM(msgs, (s) => {
        loadingRow.innerHTML = '';
        const body = loadingRow.querySelector('.msg-body') || loadingRow;
        let h = '<div class="msg-avatar">🤖</div><div class="msg-body">';
        const ct = s.fullThinking || splitThinking(s.fullText).thinking;
        const cx = s.fullThinking ? s.fullText : splitThinking(s.fullText).content;
        if (ct) h += '<details class="thinking-box" open><summary>思考中... (' + ct.length + ' 字)</summary><div class="thinking-text">' + esc(ct) + '</div></details>';
        h += '<div class="msg-text">' + esc(cx || '...') + '</div>';
        for (const tc of s.toolCalls) {
          h += '<details class="tool-call" open><summary>⚡ ' + esc(tc.name) + '</summary><div class="tool-args">' + esc(tc.arguments) + '</div></details>';
        }
        h += '<div class="msg-time">' + timeStr() + '</div></div>';
        loadingRow.innerHTML = h;
        scrollBottom();
      });

      loadingRow.remove();

      if (result.toolCalls.length > 0) {
        const results = result.toolCalls.map(tc => {
          let args = {};
          try { args = JSON.parse(tc.arguments); } catch {}
          return executeTool(tc.name, args);
        });
        addToolMessage(result.toolCalls, results);

        const tcForHistory = result.toolCalls.map((tc, i) => ({
          id: tc.id, type: 'function',
          function: { name: tc.name, arguments: tc.arguments }
        }));
        msgs.push({ role: 'assistant', content: result.content || null, tool_calls: tcForHistory });
        for (let i = 0; i < result.toolCalls.length; i++) {
          msgs.push({ role: 'tool', tool_call_id: result.toolCalls[i].id, content: results[i] });
        }
        chatHistory = msgs;
        continue;
      }

      const split = splitThinking(result.content);
      addAssistantBubble(
        result.thinking ? result.content : (split.content || result.content),
        result.thinking || split.thinking
      );
      chatHistory.push({ role: 'assistant', content: result.content });
      break;
    }
  } catch (err) {
    loadingRow.remove();
    if (reqLog[0]) { reqLog[0].error = err.message; reqLog[0].streaming = false; reqLog[0].ms = Date.now() - t0; renderLogPanel(); }
    showError(err.message);
  }
  isStreaming = false;
  $send.disabled = false;
  $input.focus();
}

// ── Chat Room LLM Call ─────────────────────
// Each participant maintains a persistent upstream session.
// First call primes the persona; subsequent calls only send new context.


// kimi-web and glm-web do not support session persistence — each call is fresh.
// They need full persona + full history on every turn.
const STATELESS_PROVIDERS = ['kimi-web'];
function isStatelessProvider(modelId) {
  return STATELESS_PROVIDERS.some(p => (modelId || '').startsWith(p));
}
const croomSessionInit = {}; // keyed by participant name

async function callChatRoomLLM(participant, historyLines, lastSpokeIdx) {
	const headers = authHeaders({ 'Content-Type': 'application/json' });
	const cookie = getCookie();
	if (cookie) headers['x-cookie'] = cookie;

		const needsFullContext = isStatelessProvider(participant.model) || !croomSessionInit[participant.name];
		let prompt;

		if (needsFullContext) {
			// First message: set up persona + show conversation so far
			const contextText = historyLines.map(h => {
				return `${h.speaker}: ${h.content}`;
			}).join('\n');

			prompt = `[System]: 你是${participant.name}。${participant.persona}\n\n当前聊天记录：\n${contextText}\n\n[User]: 请用${participant.name}的身份发言。`;

			if (!isStatelessProvider(participant.model)) {
				croomSessionInit[participant.name] = true;
			}
		} else {
			// Subsequent calls: only new messages since this participant last spoke.
			// Skip their own last message (at lastSpokeIdx), show only what others said after.
			const newLines = historyLines.slice(lastSpokeIdx + 1);
			prompt = newLines.map(h => {
				return `${h.speaker}: ${h.content}`;
			}).join('\n');
			// No new messages since last spoke — skip this turn
			if (!prompt.trim()) return '';
		}
	const body = {
		model: participant.model,
		messages: [{ role: 'user', content: prompt }],
		stream: true,
		session_id: participant._sessionId,
		mode: 'chatroom'
	};

	const resp = await fetch(API + '/v1/chat/completions', {
		method: 'POST', headers,
		body: JSON.stringify(body),
		signal: chatRoomAbort ? chatRoomAbort.signal : undefined,
	});

	if (!resp.ok) {
		const err = await resp.json().catch(() => ({ error: { message: 'HTTP ' + resp.status } }));
		throw new Error(err.error?.message || 'Request failed');
	}

	const reader = resp.body.getReader();
	const dec = new TextDecoder();
	let buf = '', fullText = '';

	while (true) {
		const { done, value } = await reader.read();
		if (done) break;
		buf += dec.decode(value, { stream: true });
		const lines = buf.split('\n');
		buf = lines.pop() || '';
		for (const line of lines) {
			if (!line.startsWith('data: ')) continue;
			const d = line.slice(6);
			if (d === '[DONE]') continue;
			try {
				const p = JSON.parse(d);
				const content = p.choices?.[0]?.delta?.content;
				if (content) fullText += content;
				updateCroomStreaming(fullText);
			} catch {}
		}
	}
	return fullText.trim();
}
function updateCroomStreaming(text) {
  if (croomStreamingEl) {
    const bubble = croomStreamingEl.querySelector('.croom-bubble');
    if (bubble) bubble.textContent = text || '...';
    scrollBottom();
  }
}

function addCroomMsg(speaker, model, content, isHost) {
  const container = document.getElementById('croom-messages') || $messages;
  const row = document.createElement('div');
  row.className = 'croom-msg' + (isHost ? ' host' : '');
  const colorIdx = chatRoomParticipants.findIndex(p => p.name === speaker);
  const color = colorIdx >= 0 ? participantColors[colorIdx % participantColors.length] : '#888';
  row.innerHTML = `
    <div class="croom-avatar" style="background:${color};color:#fff;font-size:14px;">${esc(speaker[0] || '?')}</div>
    <div class="msg-body" style="min-width:0;">
      <div class="croom-speaker">${esc(speaker)} <span style="font-weight:400;color:var(--text3);font-size:10px;">${esc(model.split('/').pop() || '')}</span></div>
      <div class="croom-bubble">${esc(content)}</div>
      <div class="croom-time">${timeStr()}</div>
    </div>
  `;
  container.appendChild(row);
  scrollBottom();
  return row;
}

function addCroomStreamingPlaceholder(speaker, model) {
  const container = document.getElementById('croom-messages') || $messages;
  const row = document.createElement('div');
  row.className = 'croom-msg';
  const colorIdx = chatRoomParticipants.findIndex(p => p.name === speaker);
  const color = colorIdx >= 0 ? participantColors[colorIdx % participantColors.length] : '#888';
  row.innerHTML = `
    <div class="croom-avatar" style="background:${color};color:#fff;font-size:14px;">${esc(speaker[0] || '?')}</div>
    <div class="msg-body" style="min-width:0;">
      <div class="croom-speaker">${esc(speaker)} <span style="font-weight:400;color:var(--text3);font-size:10px;">${esc(model.split('/').pop() || '')}</span></div>
      <div class="croom-bubble"><div class="loading"><span></span><span></span><span></span></div></div>
      <div class="croom-time">${timeStr()}</div>
    </div>
  `;
  container.appendChild(row);
  scrollBottom();
  return row;
}

async function startChatRoom() {
  const topic = document.getElementById('croom-topic').value.trim();
  if (!topic) { alert('请输入开场白/话题'); return; }
  if (chatRoomParticipants.length < 2) { alert('请至少添加2个参与者'); return; }
  // Validate all participants have models
  const missing = chatRoomParticipants.filter(p => !p.model);
  if (missing.length > 0) { alert('请为每个参与者选择模型: ' + missing.map(p => p.name || '(未命名)').join(', ')); return; }

  chatRoomRunning = true;
  chatRoomAbort = new AbortController();
  document.getElementById('croom-start').style.display = 'none';
  const $stop = document.getElementById('croom-stop');
  if ($stop) $stop.style.display = '';
  $welcome.style.display = 'none';

  // Reset session tracking — each participant gets a fresh upstream chat session
  for (const k of Object.keys(croomSessionInit)) delete croomSessionInit[k];
  // Generate persistent session IDs so upstream LLMs reuse the same session across rounds
  chatRoomParticipants.forEach(p => {
    p._sessionId = 'croom_' + p.name.replace(/[^a-zA-Z0-9一-鿿]/g, '_') + '_' + Date.now().toString(36);
  });

  // Track when each participant last spoke (index in chatRoomHistory)
  const lastSpokeIdx = {};

  // Add topic message
  addCroomMsg('主持人', '', topic, true);
  chatRoomHistory = [{ speaker: '主持人', content: topic }];
  saveCroomConfig();

  const maxRounds = parseInt(document.getElementById('croom-rounds').value) || 10;
  let round = 0;
  let currentSpeakerIdx = 0;
  let stallCount = 0;

  try {
    while (round < maxRounds && chatRoomRunning && stallCount < chatRoomParticipants.length) {
      const participant = chatRoomParticipants[currentSpeakerIdx];
      const status = document.getElementById('croom-status');
      if (status) status.textContent = `第 ${round + 1}/${maxRounds} 轮 · ${participant.name} 正在输入...`;

      // Show loading
      croomStreamingEl = addCroomStreamingPlaceholder(participant.name, participant.model);

      try {
        // Pass the history index AFTER which new messages appear for this participant
        const prevIdx = lastSpokeIdx[participant.name] ?? 0;
        const response = await callChatRoomLLM(participant, chatRoomHistory, prevIdx);
        // Remove streaming placeholder
        if (croomStreamingEl) croomStreamingEl.remove();
        croomStreamingEl = null;

        if (response) {
          addCroomMsg(participant.name, participant.model, response, false);
          chatRoomHistory.push({ speaker: participant.name, model: participant.model, content: response });
          lastSpokeIdx[participant.name] = chatRoomHistory.length - 1;
          saveCroomConfig();
          stallCount = 0;

          // Check for stop phrase (only if response is short and contains the keyword)
          const trimmed = response.trim();
          if (trimmed.length < 30 && /^(结束聊天室|结束对话|聊天结束|stop\s*chat)/i.test(trimmed)) {
            addCroomMsg('系统', '', '聊天室已结束。', false);
            break;
          }
        } else {
          stallCount++;
        }
      } catch (e) {
        if (croomStreamingEl) croomStreamingEl.remove();
        croomStreamingEl = null;
        if (e.name === 'AbortError') break;
        addCroomMsg(participant.name, participant.model, `[错误] ${e.message}`, false);
      }

      currentSpeakerIdx = (currentSpeakerIdx + 1) % chatRoomParticipants.length;
      round++;

      // Delay between messages for natural feel
      if (chatRoomRunning && round < maxRounds) {
        const delayMs = (parseFloat(document.getElementById('croom-delay')?.value) || 1.5) * 1000;
        await new Promise(r => setTimeout(r, delayMs));
      }
    }
  } finally {
    chatRoomRunning = false;
    chatRoomAbort = null;
    document.getElementById('croom-start').style.display = '';
    const $stop = document.getElementById('croom-stop');
    if ($stop) $stop.style.display = 'none';
    const status = document.getElementById('croom-status');
    if (status) status.textContent = chatRoomHistory.length > 1 ? `已结束 · 共 ${chatRoomHistory.length} 条消息` : '';
  }
}

function stopChatRoom() {
  chatRoomRunning = false;
  if (chatRoomAbort) { chatRoomAbort.abort(); chatRoomAbort = null; }
}

// ── Session Manager ─────────────────────────
function showManageCroomSessions() {
  let html = '<div style="position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;display:flex;align-items:center;justify-content:center;" onclick="this.remove()">';
  html += '<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto;" onclick="event.stopPropagation()">';
  html += '<h3 style="margin-bottom:12px;">📋 聊天室会话管理</h3>';
  html += '<p style="color:var(--text2);font-size:12px;margin-bottom:12px;">聊天室使用无状态模式调用上游LLM，所有历史记录由本地浏览器维护。关闭页面后会话丢失（除非保存）。</p>';

  // Current session info
  html += `<p style="font-size:13px;margin-bottom:8px;">当前会话: ${chatRoomHistory.length} 条消息, ${chatRoomParticipants.length} 个参与者</p>`;

  // Export/Import buttons
  html += '<div style="display:flex;gap:8px;margin-bottom:12px;">';
  html += '<button class="btn-secondary" onclick="exportCroomSession()">📥 导出会话</button>';
  html += '<button class="btn-secondary" onclick="importCroomSession()">📤 导入会话</button>';
  html += '</div>';

  // Session list (from localStorage)
  const sessions = getStoredCroomSessions();
  if (sessions.length > 0) {
    html += '<h4 style="margin-bottom:8px;">已保存的会话</h4>';
    sessions.forEach((s, i) => {
      html += `<div class="participant-card" style="cursor:pointer;" onclick="loadCroomSession(${i});document.querySelector('[style*=\"position:fixed\"]').remove();switchMode('chatroom');">`;
      html += `<div class="pc-info"><div class="pc-name">${esc(s.topic || '会话 ' + (i+1))}</div>`;
      html += `<div class="pc-persona">${s.msgCount || 0} 条消息 · ${s.date || ''}</div></div>`;
      html += `<button class="pc-remove" onclick="event.stopPropagation();deleteCroomSession(${i})">✕</button>`;
      html += '</div>';
    });
  }

  html += '</div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
}

function exportCroomSession() {
  const data = {
    participants: chatRoomParticipants,
    history: chatRoomHistory,
    topic: chatRoomHistory[0]?.content || '',
    date: new Date().toLocaleString('zh-CN'),
    msgCount: chatRoomHistory.length,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `chatroom-${Date.now()}.json`; a.click();
  URL.revokeObjectURL(url);
}

function importCroomSession() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = () => {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        chatRoomParticipants = data.participants || [];
        chatRoomHistory = data.history || [];
        renderParticipants();
        saveCroomConfig();
        // Replay history
        $messages.innerHTML = '';
        for (const h of chatRoomHistory) {
          addCroomMsg(h.speaker, h.model || '', h.content, h.speaker === '主持人');
        }
      } catch (e) { alert('导入失败: ' + e.message); }
    };
    reader.readAsText(file);
  };
  input.click();
}

function getStoredCroomSessions() {
  try { return JSON.parse(localStorage.getItem('myzt_croom_sessions') || '[]'); } catch { return []; }
}

function loadCroomSession(idx) {
  const sessions = getStoredCroomSessions();
  if (idx >= 0 && idx < sessions.length) {
    const s = sessions[idx];
    chatRoomParticipants = s.participants || [];
    chatRoomHistory = s.history || [];
    renderParticipants();
    saveCroomConfig();
    // Replay history
    $messages.innerHTML = '';
    for (const h of chatRoomHistory) {
      addCroomMsg(h.speaker, h.model || '', h.content, h.speaker === '主持人');
    }
  }
}

function deleteCroomSession(idx) {
  const sessions = getStoredCroomSessions();
  sessions.splice(idx, 1);
  localStorage.setItem('myzt_croom_sessions', JSON.stringify(sessions));
  // Refresh the modal
  document.querySelector('[style*=\"position:fixed\"]')?.remove();
  showManageCroomSessions();
}

function clearChat() {
  if (currentMode === 'chatroom') {
    chatRoomHistory = [];
    const cm = document.getElementById('croom-messages');
    if (cm) cm.innerHTML = '';
    saveCroomConfig();
    return;
  }
  chatHistory = [];
  $messages.innerHTML = '';
  $welcome.style.display = 'flex';
}

// ── Events ─────────────────────────────────
$send.addEventListener('click', sendMessage);
$input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

// ── Init ───────────────────────────────────
loadModels();
</script>
